name: Mise à jour des scores

on:
  schedule:
    # Toutes les 15 min = 96 req/jour — dans la limite gratuite d'API-Football (100/jour)
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier la période du tournoi
        id: period
        run: |
          today=$(date -u +%Y-%m-%d)
          if [[ "$today" > "2026-06-10" && "$today" < "2026-07-20" ]]; then
            echo "active=true"  >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer les scores (API-Football / RapidAPI)
        if: steps.period.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          # League 1 = FIFA World Cup, Season 2026
          curl -sf \
            -H "X-RapidAPI-Key: $RAPIDAPI_KEY" \
            -H "X-RapidAPI-Host: api-football-v1.p.rapidapi.com" \
            "https://api-football-v1.p.rapidapi.com/v3/fixtures?league=1&season=2026" \
            -o raw.json

          python3 - <<'EOF'
          import json
          from datetime import datetime, timezone

          with open("raw.json") as f:
              data = json.load(f)

          slim = []
          for item in data.get("response", []):
              fix    = item.get("fixture", {})
              teams  = item.get("teams", {})
              goals  = item.get("goals", {})
              status = fix.get("status", {})

              # Statut normalisé identique à football-data.org pour compatibilité
              raw_status = status.get("short", "")
              STATUS_MAP = {
                  "NS":  "SCHEDULED",
                  "1H":  "IN_PLAY",
                  "HT":  "PAUSED",
                  "2H":  "IN_PLAY",
                  "ET":  "IN_PLAY",
                  "P":   "IN_PLAY",
                  "FT":  "FINISHED",
                  "AET": "FINISHED",
                  "PEN": "FINISHED",
                  "PST": "POSTPONED",
                  "CANC":"POSTPONED",
              }
              norm_status = STATUS_MAP.get(raw_status, "SCHEDULED")

              slim.append({
                  "homeTeam": teams.get("home", {}).get("name", ""),
                  "awayTeam": teams.get("away", {}).get("name", ""),
                  "status":   norm_status,
                  "score": {
                      "fullTime": {
                          "home": goals.get("home"),
                          "away": goals.get("away"),
                      }
                  },
                  "minute": status.get("elapsed"),
              })

          out = {
              "matches": slim,
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "source":  "api-football",
          }
          with open("scores.json", "w") as f:
              json.dump(out, f, separators=(",", ":"))
          print(f"✓ {len(slim)} matchs — {sum(1 for m in slim if m['status'] in ('IN_PLAY','PAUSED'))} en direct")
          EOF

      - name: Commit si scores modifiés
        if: steps.period.outputs.active == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json
          git diff --staged --quiet \
            && echo "Aucun changement." \
            || (git commit -m "chore: scores $(date -u '+%H:%M UTC')" && git push)
